name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # skip the optional heavy extras in CI; the fallback paths are what we test
          pip install fastapi uvicorn pydantic numpy httpx pytest ruff black
      - name: Lint
        run: |
          ruff check backend
          black --check backend
      - name: Test
        working-directory: backend
        run: python -m pytest tests -q
      - name: Smoke the worked example
        working-directory: backend
        run: python scripts/seed.py
